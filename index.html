<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nothing's here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17171a;
    --bg-alt: #202024;
    --panel: #1d1d21;
    --grid-line: #2c2c31;
    --text: #e7e4dd;
    --text-dim: #85828c;
    --magenta: #ff2f92;
    --cyan: #2fe1ff;
    --amber: #ffb236;
    --green: #7dffb2;
	--ngreen: #3ecd40;
	--pink: #ff46a2;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* ---------- background hex-rain canvas ---------- */
  #hexfield{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* ---------- scanline / vignette overlay ---------- */
  .crt-overlay{
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.10) 3px,
        rgba(0,0,0,0) 4px
      );
    mix-blend-mode: multiply;
  }
  .vignette{
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
  }

  .sweep{
    position: fixed;
    left: 0;
    right: 0;
    height: 140px;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(47,225,255,0) 0%,
      rgba(47,225,255,0.05) 45%,
      rgba(47,225,255,0.10) 50%,
      rgba(47,225,255,0.05) 55%,
      rgba(47,225,255,0) 100%
    );
    animation: sweepdown 7s linear infinite;
  }
  @keyframes sweepdown{
    0%{ top: -140px; }
    100%{ top: 100%; }
  }

  /* ---------- layout ---------- */
  main{
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6vh 24px;
    text-align: center;
  }

  .boot-line{
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 22px;
    opacity: 0;
    animation: fadein 0.6s ease forwards;
    animation-delay: 0.1s;
  }
  .boot-line .ok{ color: var(--green); }

  h1{
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(2.4rem, 8vw, 5.5rem);
    letter-spacing: 0.02em;
    margin: 0 0 6px 0;
    line-height: 1;
    position: relative;
    color: var(--text);
    animation: flicker-in 1.4s steps(1,end) 0.3s both;
  }
  h1 .accent{
    color: var(--ngreen);
    text-shadow: 0 0 18px rgba(19, 195, 30, 0.57)
  }

  .subtitle{
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin: 0 0 56px 0;
    opacity: 0;
    animation: fadein 0.8s ease forwards;
    animation-delay: 1.1s;
  }
  .subtitle .divider{ color: var(--cyan); margin: 0 10px; }

  /* ---------- menu / buttons ---------- */
  nav.menu{
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: min(420px, 86vw);
    opacity: 0;
    animation: fadein 0.8s ease forwards;
    animation-delay: 1.5s;
  }

  .menu a{
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    background: var(--panel);
    border: 1px solid var(--grid-line);
    color: var(--text);
    text-decoration: none;
    font-family: 'Space Mono', monospace;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
    text-align: left;
    border-radius: 3px;
    overflow: hidden;
    transition: border-color 0.25s ease, transform 0.2s ease, background 0.25s ease;
  }

  .menu a .idx{
    color: var(--text-dim);
    font-size: 0.8rem;
    min-width: 20px;
  }

  .menu a .label{
    flex: 1;
  }

  .menu a .arrow{
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    color: var(--bg);
    font-size: 0.9rem;
  }

  .menu a::before{
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--line-color, var(--cyan));
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.25s ease;
  }

  .menu a:nth-child(1){ --line-color: var(--ngreen); }
  .menu a:nth-child(2){ --line-color: var(--amber); }
  .menu a:nth-child(3){ --line-color: var(--pink); }

  .menu a:hover, .menu a:focus-visible{
    border-color: var(--line-color, var(--cyan));
    transform: translateX(4px);
    background: var(--bg-alt);
    outline: none;
  }
  .menu a:hover::before, .menu a:focus-visible::before{
    transform: scaleY(1);
  }
  .menu a:hover .idx, .menu a:focus-visible .idx{
    color: var(--line-color, var(--cyan));
  }
  .menu a:hover .arrow, .menu a:focus-visible .arrow{
    opacity: 1;
    transform: translateX(0);
    color: var(--line-color, var(--cyan));
  }

  footer{
    position: relative;
    z-index: 3;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 0 20px 28px;
    opacity: 0;
    animation: fadein 0.8s ease forwards;
    animation-delay: 1.9s;
  }

  /* ---------- animations ---------- */
  @keyframes fadein{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @keyframes flicker-in{
    0%{ opacity: 0; }
    3%{ opacity: 1; }
    6%{ opacity: 0.2; }
    8%{ opacity: 1; }
    10%{ opacity: 0.3; }
    12%{ opacity: 1; }
    30%{ opacity: 1; }
    32%{ opacity: 0.4; }
    34%{ opacity: 1; }
    100%{ opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    #hexfield{ display: none; }
    .sweep{ display: none; }
    h1, .subtitle, .boot-line, nav.menu, footer{
      animation: none !important;
      opacity: 1 !important;
    }
  }
</style>
</head>
<body>

<canvas id="hexfield"></canvas>
<div class="sweep"></div>
<div class="crt-overlay"></div>
<div class="vignette"></div>

<main>
  <div class="boot-line">SYSTEM READY <span class="ok">■ OK</span> &nbsp;·&nbsp; STANDING BY...</div>

<h1>ATY<span class="accent">LO</span>.SYS</h1>

  <nav class="menu">
    <a href="/pfe/remains.html" aria-label="Button one">
      <span class="idx">FoE</span>
      <span class="label">Play FoE: Remains 1.0.4</span>
      <span class="arrow">&rarr;</span>
    </a>
    <a href="#" aria-label="Button two">
      <span class="idx">FNP</span>
      <span class="label">Play FoE: NEW Pegas</span>
      <span class="arrow">&rarr;</span>
    </a>
    <a href="https://youtu.be/3MIkeJgrbHU" aria-label="Button three">
      <span class="idx">76</span>
      <span class="label">Play Fallout 76</span>
      <span class="arrow">&rarr;</span>
    </a>
  </nav>
</main>

<footer>BUILD alpha tango yankee &nbsp;·&nbsp; atylo 2026</footer>

<script>
  // Colorful flowing wave field, PS3 XMB style, over a dark grey base
  const canvas = document.getElementById('hexfield');
  const ctx = canvas.getContext('2d');
  let w, h;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const bands = [
    { color: '255,47,146',  baseY: 0.30, amp: 46, amp2: 18, freq: 0.0016, freq2: 0.004, speed: 0.00034, speed2: 0.0011, phase: 0.0 },
    { color: '47,225,255',  baseY: 0.48, amp: 60, amp2: 22, freq: 0.0011, freq2: 0.003, speed: 0.00026, speed2: 0.0009, phase: 1.7 },
    { color: '255,178,54',  baseY: 0.64, amp: 38, amp2: 16, freq: 0.0019, freq2: 0.0045,speed: 0.00040, speed2: 0.0013, phase: 3.4 },
    { color: '125,255,178', baseY: 0.80, amp: 50, amp2: 20, freq: 0.0013, freq2: 0.0035,speed: 0.00030, speed2: 0.0010, phase: 5.1 }
  ];

  function waveY(x, t, band){
    return h * band.baseY
      + Math.sin(x * band.freq + t * band.speed + band.phase) * band.amp
      + Math.sin(x * band.freq2 + t * band.speed2 + band.phase * 1.3) * band.amp2;
  }

  function drawBand(band, t){
    const step = 6;
    ctx.beginPath();
    ctx.moveTo(0, h);
    ctx.lineTo(0, waveY(0, t, band));
    for(let x = 0; x <= w; x += step){
      ctx.lineTo(x, waveY(x, t, band));
    }
    ctx.lineTo(w, h);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, h * band.baseY - band.amp - band.amp2, 0, h);
    grad.addColorStop(0, `rgba(${band.color}, 0.16)`);
    grad.addColorStop(0.35, `rgba(${band.color}, 0.07)`);
    grad.addColorStop(1, `rgba(${band.color}, 0)`);
    ctx.fillStyle = grad;
    ctx.fill();

    // bright crest line to sell the "flow" edge
    ctx.beginPath();
    ctx.moveTo(0, waveY(0, t, band));
    for(let x = 0; x <= w; x += step){
      ctx.lineTo(x, waveY(x, t, band));
    }
    ctx.strokeStyle = `rgba(${band.color}, 0.35)`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function draw(t){
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#17171a';
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';
    bands.forEach(band => drawBand(band, t));
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(draw);
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduceMotion){
    requestAnimationFrame(draw);
  } else {
    draw(0);
  }
</script>

</body>
</html>
